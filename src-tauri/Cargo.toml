[package]
name = "album-builder"
version = "0.2.2"
description = "A local-first album sequencing workspace"
authors = ["Patrick Carroll"]
edition = "2021"
rust-version = "1.77.2"

# Prototype builds are licence-free. Commercial builds explicitly opt in:
# cargo build --features licensed-release
[features]
default = []
licensed-release = []

[lib]
name = "album_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Lemon Squeezy's licence endpoints are ordinary HTTPS form requests. Rustls
# keeps this small desktop app independent of a separately installed TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

base64 = "0.22"
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
